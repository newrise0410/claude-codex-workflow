<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>할 일</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <h1>할 일</h1>
      <form id="new-todo-form" autocomplete="off">
        <input id="new-todo-input" type="text" placeholder="할 일을 입력하세요" maxlength="200" aria-label="새 할 일">
        <button type="submit">추가</button>
      </form>
      <section class="card">
        <nav id="filters" aria-label="필터">
          <button type="button" data-filter="all" aria-pressed="true">전체</button>
          <button type="button" data-filter="active" aria-pressed="false">진행 중</button>
          <button type="button" data-filter="completed" aria-pressed="false">완료</button>
        </nav>
        <ul id="todo-list"></ul>
        <p id="empty-state" hidden>할 일이 없습니다</p>
        <footer class="card-footer">
          <span id="items-left">0개 남음</span>
          <button id="clear-completed" type="button">완료 항목 삭제</button>
        </footer>
      </section>
    </main>
    <script src="todo.js"></script>
    <script src="app.js"></script>
  </body>
</html>
